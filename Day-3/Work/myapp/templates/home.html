<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#4facfe,#00f2fe);
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-box{
            width: 100%;
            max-width: 450px;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .register-box h2{
            text-align: center;
            margin-bottom: 25px;
            color: #0d6efd;
            font-weight: bold;
        }

        .form-control{
            border-radius: 8px;
        }

        .btn-register{
            width: 100%;
            border-radius: 8px;
            font-size: 18px;
            padding: 10px;
        }
    </style>
</head>
<body>


<div class="register-box">
    <h2>User Registration</h2>

    <form method="post" action="{%url 'useradd'%}" enctype="multipart/form-data">
        {%csrf_token%}
        <span class="text-success">{{meg}}</span>
        <input type="hidden" value="{{u.id}}" name="id">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" placeholder="Enter your name" name="name" value="{{u.name}}">
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" placeholder="Enter your email" name="email"  value="{{u.email}}">
        </div>

        <div class="mb-3">
            <label class="form-label">Age</label>
            <input type="number" class="form-control" placeholder="Enter your age" name="age"  value="{{u.age}}">
        </div>

        <div class="mb-3">
            <label class="form-label">Contact Number</label>
            <input type="tel" class="form-control" placeholder="Enter your contact number" name="contact"  value="{{u.contact}}">
        </div><br>
        {% if u%}
        <img src="/media/{{u.image}}" alt="j1.jpg" height="50px " width="50px">
        {%endif%}<br>
        <br>
        <input type="file" name="image" value="{{u.image}}" class="form-control"><br>

        <button type="submit" class="btn btn-success ">
            Register
        </button>
         <a href="{%url 'userview'%}" class="btn btn-primary">View Data</a>
    <a href="{% url 'user-logout'%}" class="btn btn-warning">Logout</a>
   

    </form>
</div>

</body>
</html>
