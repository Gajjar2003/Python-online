<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Table</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .table-container {
            width: 90%;
            max-width: 900px;
            margin: 50px auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #0d6efd;
            margin-bottom: 20px;
            font-weight: bold;
        }

        table {
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            text-align: center;
        }

        td {
            text-align: center;
            vertical-align: middle;
        }

        tbody tr:hover {
            background-color: #e9f5ff;
        }
    </style>
</head>

<body>

    <div class="table-container">

        <h2>User Details Table</h2>

        <table class="table table-bordered table-hover table-striped">
            <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Age</th>
                    <th>Contact</th>
                    <th colspan="2">Action</th>
                </tr>
            </thead>

            <tbody>
                {% for u in users%}
                <tr>
                    <td>{{forloop.counter}}</td>
                    <td>{{u.name}}</td>
                    <td>{{u.email}}</td>
                    <td>{{u.age}}</td>
                    <td>{{u.contact}}</td>
                    <td><a href="{% url 'delete'%}?id={{u.id}}" class="btn btn-danger">Delete</a></td>
                    <td><a href="{% url 'edit'%}?id={{u.id}}" class="btn btn-primary">Edit</a></td>

                </tr>
                {%endfor%}



            </tbody>

        </table>
        <a href="{%url 'home'%}" class="btn btn-warning">New User add</a>

    </div>

</body>

</html>
