<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <style>
        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            font-family: Arial, sans-serif;
        }

        .card {
            max-width: 700px;
            margin: 50px auto;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            background: #0d6efd;
            color: white;
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            border-radius: 15px 15px 0 0 !important;
        }

        .btn {
            width: 100%;
        }

        .table {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <script>
        $(document).ready(function (rt) {
            viewProduct()
            $("#smbtn").show()
            $("#upbtn").hide()
        })

        function addProduct() {
            var name = $("#name").val()
            var qty = $("#qty").val()
            var price = $("#price").val()
            var csrfmiddlewaretoken = $("input[name='csrfmiddlewaretoken']").val();

            $.post('register', { name, qty, price, csrfmiddlewaretoken }, function (rt) {
                alert(rt)
            })

        }

        function viewProduct() {

            $.get('display', {}, function (rt) {
                row = ""
                rt.p.map(ele => {
                    row += `<tr>
                        <td>${ele.id}</td>
                        <td>${ele.name}</td>
                        <td>${ele.qty}</td>
                        <td>${ele.price}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="editProduct(${ele.id})">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="Productdelete(${ele.id})">Delete</button>
                        </td>
                    </tr>`
                })

                $("#tdata").html(row)


            })
        }

        function Productdelete(pid) {
            $.get('delete', { pid }, function (rt) {
                alert(rt)
                viewProduct()

            })
        }

        function editProduct(pid) {
            $.get('edit', { pid }, function (rt) {
                $("#id").val(rt.p[0].id)
                $("#name").val(rt.p[0].name)
                $("#qty").val(rt.p[0].qty)
                $("#price").val(rt.p[0].price)

                $("#smbtn").hide()
                $("#upbtn").show()
            })
        }

        function UpdateProduct() {
            var id = $("#id").val()
            var name = $("#name").val()
            var qty = $("#qty").val()
            var price = $("#price").val()
            var csrfmiddlewaretoken = $("input[name='csrfmiddlewaretoken']").val();

            $.post('update', { id, name, qty, price, csrfmiddlewaretoken }, function (rt) {
                alert(rt)
                viewProduct()

                $("#smbtn").show()
                $("#upbtn").hide()

            })
        }
    </script>

    <div class="container">

        <!-- Product Form -->
        <div class="card">
            <div class="card-header">
                Product Form
            </div>

            <div class="card-body">
                <form>
                    {%csrf_token%}

                    <input type="hidden" id="id" name="id">
                    <div class="mb-3">
                        <label class="form-label">Product Name</label>
                        <input type="text" class="form-control" placeholder="Enter Product Name" id="name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Quantity</label>
                        <input type="number" class="form-control" placeholder="Enter Quantity" id="qty">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Price</label>
                        <input type="number" class="form-control" placeholder="Enter Price" id="price">
                    </div>

                    <button type="submit" class="btn btn-primary" onclick="addProduct()" id="smbtn">
                        Submit
                    </button>

                    <button type="submit" class="btn btn-primary" onclick="UpdateProduct()" id="upbtn">
                        Update
                    </button>
                </form>
            </div>
        </div>

        <!-- Product Table -->
        <div class="card mt-4">
            <div class="card-header">
                Product List
            </div>

            <div class="card-body">

                <table class="table table-bordered table-hover table-striped text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Product Name</th>
                            <th>Quantity</th>
                            <th>Price (₹)</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="tdata">



                    </tbody>

                </table>

            </div>
        </div>

    </div>

</body>

</html>
