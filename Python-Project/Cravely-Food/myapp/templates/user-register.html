{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Cravely</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    body {
      background: #0b1020;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 430px;
      background: #111827;
      padding: 30px;
      border: 1px solid #263142;
      border-radius: 20px;
    }

    .brand {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: white;
      margin-bottom: 10px;
    }

    .brand span {
      color: #ff7629;
    }

    h3 {
      text-align: center;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .subtitle {
      text-align: center;
      color: #aab4c3;
      margin-bottom: 25px;
    }

    .form-label {
      color: #e2e8f0;
    }

    .form-control {
      background: #0b1020;
      color: white;
      border: 1px solid #263142;
      padding: 11px;
    }

    .form-control:focus {
      background: #0b1020;
      color: white;
      border-color: #ff7629;
      box-shadow: none;
    }

    .form-control::placeholder {
      color: #8b95a5;
    }

    .btn-register {
      background: #ff7629;
      color: white;
      width: 100%;
      padding: 12px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
    }

    .btn-register:hover {
      background: #e85e12;
      color: white;
    }

    .login-link {
      color: #ff7629;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="register-box">

    <div class="brand">Cravely<span>.</span></div>

    <h3>Create Account</h3>
    <p class="subtitle">Join Cravely and enjoy delicious food.</p>

    <form method="POST">
      {% csrf_token %}

      {% if meg %}
      <div class="alert alert-success">{{ meg }}</div>
      {% endif %}

      {% if err %}
      <div class="alert alert-danger">{{ err }}</div>
      {% endif %}

      <div class="mb-3">
        <label class="form-label">First Name</label>
        <input type="text" name="fname" class="form-control" placeholder="Enter first name" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Last Name</label>
        <input type="text" name="lname" class="form-control" placeholder="Enter last name" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="Enter email" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter username" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn-register">
        Create Account <i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <p class="text-center mt-4 mb-0">
      Already have an account?
      <a href="{% url 'user-login'%}" class="login-link">Login</a>
    </p>

  </div>

</body>

</html>
