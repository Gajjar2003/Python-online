
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Table | Cravely</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0b1020;
            color: white;
        }

        .booking-card {
            background: #111827;
            border: 1px solid #263142;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            margin: 50px auto;
        }

        .orange {
            color: #ff7629;
        }

        .form-control, .form-select {
            background: #0b1020;
            color: white;
            border: 1px solid #263142;
            padding: 12px;
        }

        .form-control:focus, .form-select:focus {
            background: #0b1020;
            color: white;
            border-color: #ff7629;
            box-shadow: none;
        }

        .form-select option {
            background: #111827;
            color: white;
        }

        .btn-orange {
            background: #ff7629;
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
        }

        .btn-orange:hover {
            background: #e65e15;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="booking-card">

        <h2 class="orange text-center mb-2">Book Your Table</h2>

        <p class="text-secondary text-center mb-4">
            Reserve your favourite restaurant with Cravely.
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <input type="hidden"
                   name="restaurant_name"
                   value="{{ restaurant_name }}">

            <div class="mb-3">
                <label class="form-label">Restaurant Name</label>
                <input type="text"
                       class="form-control"
                       value="{{ restaurant_name }}"
                       readonly>
            </div>

            <div class="mb-3">
                <label class="form-label">Booking Date</label>
                <input type="date"
                       name="booking_date"
                       class="form-control"
                       min="{{ today }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Select Session</label>
                <select name="session" id="session"
                        class="form-select" required>
                    <option value="">Choose Session</option>
                    <option value="Morning">Morning (10 AM - 12 PM)</option>
                    <option value="Afternoon">Afternoon (12 PM - 4 PM)</option>
                    <option value="Evening">Evening (4 PM - 7 PM)</option>
                    <option value="Night">Night (7 PM - 11 PM)</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Select Time</label>
                <select name="booking_time" id="booking_time"
                        class="form-select" required>
                    <option value="">First select session</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label">Number of Guests</label>
                <select name="guests" class="form-select" required>
                    <option value="1">1 Guest</option>
                    <option value="2" selected>2 Guests</option>
                    <option value="3">3 Guests</option>
                    <option value="4">4 Guests</option>
                    <option value="5">5 Guests</option>
                    <option value="6">6 Guests</option>
                    <option value="8">8 Guests</option>
                    <option value="10">10 Guests</option>
                    <option value="15">15 Guests</option>
                    <option value="20">20 Guests</option>
                </select>
            </div>

            <button type="submit" class="btn btn-orange w-100">
                Confirm Table Booking
            </button>

            <a href="{% url 'home' %}"
               class="btn btn-outline-light w-100 mt-3">
                Back to Home
            </a>

        </form>

    </div>

</div>

<script>
    const sessionSelect = document.getElementById("session");
    const timeSelect = document.getElementById("booking_time");

    const sessionTimes = {
        Morning: [
            "10:00", "10:30", "11:00", "11:30"
        ],
        Afternoon: [
            "12:00", "12:30", "13:00", "13:30",
            "14:00", "14:30", "15:00", "15:30"
        ],
        Evening: [
            "16:00", "16:30", "17:00", "17:30",
            "18:00", "18:30"
        ],
        Night: [
            "19:00", "19:30", "20:00", "20:30",
            "21:00", "21:30", "22:00", "22:30"
        ]
    };

    sessionSelect.addEventListener("change", function () {

        timeSelect.innerHTML =
            '<option value="">Choose Time</option>';

        const selectedSession = this.value;

        if (sessionTimes[selectedSession]) {

            sessionTimes[selectedSession].forEach(function (time) {

                const option = document.createElement("option");

                option.value = time;
                option.textContent = time;

                timeSelect.appendChild(option);

            });
        }
    });
</script>

</body>
</html>
