
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}StudyMate AI{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            background: #0b1020;
            color: #f1f5f9;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .brand {
            color: #a78bfa !important;
            font-size: 25px;
            font-weight: bold;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 32px;
            background: #151c30;
            border: 1px solid #29334c;
            border-radius: 20px;
        }

        .form-control {
            background: #0b1020;
            color: white;
            border: 1px solid #35415c;
            padding: 12px;
        }

        .form-control:focus {
            background: #0b1020;
            color: white;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px #8b5cf633;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .form-label {
            color: #e2e8f0;
        }

        .btn-ai {
            background: linear-gradient(90deg, #7c3aed, #4f46e5);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
        }

        .btn-ai:hover {
            background: #6d28d9;
            color: white;
        }

        .muted {
            color: #9caac2;
        }

        .dashboard-card {
            background: #151c30;
            border: 1px solid #29334c;
            border-radius: 16px;
            padding: 24px;
            height: 100%;
        }

        a {
            color: #a78bfa;
            text-decoration: none;
        }

        a:hover {
            color: #c4b5fd;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand brand"
               href="{% if user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'user-login' %}{% endif %}">
                <i class="bi bi-stars"></i> StudyMate AI
            </a>

            {% if user.is_authenticated %}
                <div class="d-flex align-items-center gap-3">
                    <span class="muted">{{ user.username }}</span>
                    <a href="{% url 'user-logout' %}"
                       class="btn btn-outline-light btn-sm">
                        Logout
                    </a>
                </div>
            {% endif %}
        </div>
    </nav>

    <main class="container py-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close"
                            data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
