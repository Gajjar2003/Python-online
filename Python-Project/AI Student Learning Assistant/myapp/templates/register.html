
{% extends 'base.html' %}

{% block title %}Register | StudyMate AI{% endblock %}

{% block content %}
<div class="d-flex justify-content-center py-3">
    <div class="auth-card">
        <div class="text-center mb-4">
            <i class="bi bi-mortarboard display-4"
               style="color:#a78bfa;"></i>
            <h2 class="fw-bold mt-3">Create Account</h2>
            <p class="muted">Start your AI-powered learning journey.</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username"
                       class="form-control"
                       placeholder="Choose username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email"
                       class="form-control"
                       placeholder="Enter email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password"
                       class="form-control"
                       placeholder="Minimum 8 characters" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password"
                       class="form-control"
                       placeholder="Confirm password" required>
            </div>

            <button type="submit" class="btn btn-ai w-100">
                Create Account <i class="bi bi-stars"></i>
            </button>
        </form>

        <p class="text-center mt-4 mb-0 muted">
            Already have an account?
            <a href="{% url 'user-login' %}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
