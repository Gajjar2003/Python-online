
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Quiz Result</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="card shadow mx-auto text-center p-4"
         style="max-width: 500px;">

        <h2 class="text-success">Quiz Completed!</h2>

        <h5 class="mt-3">Topic: {{ topic }}</h5>

        <h1 class="display-4 text-primary mt-3">
            {{ score }} / {{ total }}
        </h1>

        <p class="text-muted">Your quiz score</p>

        <p>
            Percentage:
            {% widthratio score total 100 %}%
        </p>

        <a href="{% url 'ai-quiz' %}"
           class="btn btn-primary mt-3">
            Try Another Quiz
        </a>

        <a href="{% url 'dashboard' %}"
           class="btn btn-outline-secondary mt-2">
            Dashboard
        </a>

    </div>
</div>

</body>
</html>
