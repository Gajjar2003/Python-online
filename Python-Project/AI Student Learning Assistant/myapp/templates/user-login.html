
{% extends 'base.html' %}

{% block title %}Login | StudyMate AI{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center py-3">
    <div class="auth-card">
        <div class="text-center mb-4">
            <i class="bi bi-robot display-4" style="color:#a78bfa;"></i>
            <h2 class="fw-bold mt-3">Welcome Back!</h2>
            <p class="muted">Continue your learning journey with AI.</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username"
                       class="form-control"
                       placeholder="Enter username" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password"
                       class="form-control"
                       placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn btn-ai w-100">
                Login <i class="bi bi-arrow-right"></i>
            </button>
        </form>

        <p class="text-center mt-4 mb-0 muted">
            New student?
            <a href="{% url 'register' %}">Create an account</a>
        </p>
    </div>
</div>
{% endblock %}
