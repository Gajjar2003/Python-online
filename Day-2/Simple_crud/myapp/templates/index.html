<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Well come to Home page</h1>
    <form action="{% url 'register'%}" method="post">

        <span>{{meg}}</span><br>

    <h3 align="center"><a href="{% url 'display'%}">View data</a></h3>

</html>
