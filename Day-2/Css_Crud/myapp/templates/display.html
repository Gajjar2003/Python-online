<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Table</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: #f4f7fc;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container{
            margin-top: 60px;
        }

        .card{
            border: none;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .card-header{
            background: #0d6efd;
            color: white;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            padding: 15px;
        }

        table th{
            background: #0d6efd !important;
            color: white;
        }

        table tbody tr:hover{
            background: #e8f1ff;
            transition: 0.3s;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card">

        <div class="card-header">
            Product List
        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover table-striped text-center align-middle">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product Name</th>
                        <th>Quantity</th>
                        <th>Price (₹)</th>
                        <th colspan="2">Action</th>
                    </tr>
                </thead>

                <tbody>

                    {% for p in products %}
                    <tr>
                        <td>{{ p.id }}</td>
                        <td>{{ p.name }}</td>
                        <td>{{ p.qty }}</td>
                        <td>₹{{ p.price }}</td>
                        <td><a href="{% url 'delete'%}?id={{p.id}}">Delete</a></td>
                        <td><a href="{% url 'edit'%}?id={{p.id}}">Edit</a></td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-danger fw-bold">
                            No Products Available
                        </td>
                    </tr>
                    {% endfor %}

                </tbody>

            </table>
            <a href="{% url 'index'%}">Back To Home</a>

        </div>

    </div>

</div>

</body>
</html>
