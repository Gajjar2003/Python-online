<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f5f5;
        }

        .container-box{
            max-width:900px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,0.15);
        }

        h2{
            text-align:center;
            color:#0d6efd;
            margin-bottom:25px;
        }

        .btn{
            width:100%;
        }

        table{
            margin-top:30px;
        }

        thead{
            background:#0d6efd;
            color:white;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="container-box">

        <h2>Product Form</h2>

        <form method="post" action="{% url 'register'%}">
            {%csrf_token%}
            <span>{{meg}}</span><br>
            <input type="hidden" name="id" value="{{p.id}}">
            <div class="mb-3">
                <label class="form-label">Product Name</label>
                <input type="text" class="form-control" placeholder="Enter Product Name" name="name" value="{{p.name}}">
            </div>

            <div class="mb-3">
                <label class="form-label">Quantity</label>
                <input type="number" class="form-control" placeholder="Enter Quantity" name="qty" value="{{p.qty}}">
            </div>

            <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="number" class="form-control" placeholder="Enter Price" name="price" value="{{p.price}}">
            </div>

            <button href="" class="btn btn-primary" type="submit">
                Submit
            </button>

        </form><br>

        <a href="{% url 'display'%}">View</a>

     

    </div>

</div>

</body>
</html>
