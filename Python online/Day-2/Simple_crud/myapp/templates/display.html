<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <table border="3px solid black" cellspacing="10px" cellpadding="10px" align="center">
    <tr>
        <th>ID</th>
        <td>Name</td>
        <td>Email</td>
        <td>Age</td>
        <td colspan="2">Action</td>
    </tr>

    {% for s in students%}
    <tr>
        <td>{{forloop.counter}}</td>
        <td>{{s.name}}</td>
        <td>{{s.email}}</td>
        <td>{{s.age}}</td>
        <td><a href="{% url 'delete'%}?id={{s.id}}">Delete</a></td>
        <td><a href="{% url 'edit'%}?id={{s.id}}">Edit</a></td>
    </tr>
    {%endfor%}
  </table>
  <h3 align="center"><a href="{% url 'index'%}">Back To Register</a></h3>
</body>
</html>
