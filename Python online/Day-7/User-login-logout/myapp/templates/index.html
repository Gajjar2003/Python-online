<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            min-height: 100vh;
        }

        .register-box {

            max-width: 550px;

            margin: 60px auto;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .register-title {

            text-align: center;

            font-weight: 700;

            margin-bottom: 30px;
        }

        .form-label {

            font-weight: 600;
        }

        .form-control {

            padding: 12px;

            border-radius: 10px;
        }

        .form-control:focus {

            box-shadow:
                0 0 0 0.2rem
                rgba(102, 126, 234, 0.25);
        }

        .register-btn {

            width: 100%;

            padding: 12px;

            border-radius: 10px;

            font-size: 17px;

            font-weight: 600;
        }

        .login-link {

            text-align: center;

            margin-top: 20px;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="register-box">

        <h2 class="register-title">
            Create Account
        </h2>


        <!-- Success Message -->

        {% if msg %}

        <div class="alert alert-success">
            {{ msg }}
        </div>

        {% endif %}


        <!-- Error Message -->

        {% if err %}

        <div class="alert alert-danger">
            {{ err }}
        </div>

        {% endif %}


        <!-- Register Form -->

        <form method="POST" action="{% url 'register'%}">

            {% csrf_token %}


            <!-- First Name + Last Name -->

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        First Name
                    </label>

                    <input
                        type="text"
                        name="fname"
                        class="form-control"
                        placeholder="Enter first name"
                        required
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Last Name
                    </label>

                    <input
                        type="text"
                        name="lname"
                        class="form-control"
                        placeholder="Enter last name"
                        required
                    >

                </div>

            </div>


            <!-- Username -->

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required
                >

            </div>


            <!-- Password -->

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required
                >

            </div>


            <!-- Register Button -->

            <button
                type="submit"
                class="btn btn-primary register-btn">

                Register

            </button>

        </form>


        <!-- Login -->

        <div class="login-link">

            Already have an account?

            <a
                href="{% url 'user-login' %}"
                class="text-decoration-none fw-bold">

                Login

            </a>

        </div>


    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
