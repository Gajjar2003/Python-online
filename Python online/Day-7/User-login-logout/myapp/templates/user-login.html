<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            min-height: 100vh;
        }

        .login-box {

            max-width: 450px;

            margin: 80px auto;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .login-title {

            text-align: center;

            font-weight: 700;

            margin-bottom: 30px;
        }

        .form-label {

            font-weight: 600;
        }

        .form-control {

            padding: 12px;

            border-radius: 10px;
        }

        .form-control:focus {

            box-shadow:
                0 0 0 0.2rem
                rgba(102, 126, 234, 0.25);
        }

        .login-btn {

            width: 100%;

            padding: 12px;

            border-radius: 10px;

            font-size: 17px;

            font-weight: 600;
        }

        .register-link {

            text-align: center;

            margin-top: 20px;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="login-box">

        <h2 class="login-title">
            Welcome Back
        </h2>


        <!-- Error -->

        {% if err %}

        <div class="alert alert-danger">
            {{ err }}
        </div>

        {% endif %}


        <!-- Login Form -->

        <form method="POST" >

            {% csrf_token %}


            <!-- Username -->

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required
                >

            </div>


            <!-- Password -->

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required
                >

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="btn btn-primary login-btn">

                Login

            </button>

        </form>


        <!-- Register Link -->

        <div class="register-link">

            Don't have an account?

            <a
                href="{% url 'register' %}"
                class="text-decoration-none fw-bold">

                Register

            </a>

        </div>


    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
