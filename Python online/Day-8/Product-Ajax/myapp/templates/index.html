<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Management</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <!-- Product Form -->
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white text-center">
                        <h3>Product Form</h3>
                    </div>

                    <div class="card-body">

                        <form>

                            <!-- Product Name -->
                            <div class="mb-3">
                                <label class="form-label">Product Name</label>
                                <input type="text"
                                       class="form-control"
                                       name="name"
                                       placeholder="Enter product name"
                                       required>
                            </div>

                            <!-- Quantity -->
                            <div class="mb-3">
                                <label class="form-label">Quantity</label>
                                <input type="number"
                                       class="form-control"
                                       name="qty"
                                       placeholder="Enter quantity"
                                       min="1"
                                       required>
                            </div>

                            <!-- Price -->
                            <div class="mb-3">
                                <label class="form-label">Price</label>
                                <input type="number"
                                       class="form-control"
                                       name="price"
                                       placeholder="Enter price"
                                       min="0"
                                       required>
                            </div>

                            <!-- Submit -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">
                                    Add Product
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>


        <!-- Product Table -->
        <div class="row mt-5">

            <div class="col-12">

                <div class="card shadow">

                    <div class="card-header bg-dark text-white text-center">
                        <h3>Product List</h3>
                    </div>

                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table table-bordered table-striped table-hover text-center">

                                <thead class="table-primary">
                                    <tr>
                                        <th>Id</th>
                                        <th>Product Name</th>
                                        <th>Quantity</th>
                                        <th>Price</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>

                                <tbody>

                                    <tr>
                                        <td>1</td>
                                        <td>Laptop</td>
                                        <td>5</td>
                                        <td>₹50,000</td>
                                        <td>
                                            <button class="btn btn-warning btn-sm">
                                                Edit
                                            </button>

                                            <button class="btn btn-danger btn-sm">
                                                Delete
                                            </button>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td>2</td>
                                        <td>Mouse</td>
                                        <td>20</td>
                                        <td>₹500</td>
                                        <td>
                                            <button class="btn btn-warning btn-sm">
                                                Edit
                                            </button>

                                            <button class="btn btn-danger btn-sm">
                                                Delete
                                            </button>
                                        </td>
                                    </tr>

                                    <tr>
                                        <td>3</td>
                                        <td>Keyboard</td>
                                        <td>10</td>
                                        <td>₹1,000</td>
                                        <td>
                                            <button class="btn btn-warning btn-sm">
                                                Edit
                                            </button>

                                            <button class="btn btn-danger btn-sm">
                                                Delete
                                            </button>
                                        </td>
                                    </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
