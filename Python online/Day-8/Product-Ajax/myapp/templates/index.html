<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Management</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>

<body>

    <script>

        // Page load
        $(document).ready(function () {
            displayproduct();
            $("#smbtn").show()
            $("#upbtn").hide()
        });


        function addproduct() {

            var name = $("#name").val();
            var qty = $("#qty").val();
            var price = $("#price").val();
            var csrfmiddlewaretoken = $("input[name='csrfmiddlewaretoken']").val();

            $.post('regiter', { name, qty, price, csrfmiddlewaretoken }, function (rt) {

                alert(rt);


                $("#name").val("");
                $("#qty").val("");
                $("#price").val("");


                displayproduct();
            });
        }



        function displayproduct() {

            $.get('display', {}, function (rt) {

                let row = "";

                rt.products.map(ele => {



                    row += `
                        <tr>
                            <td>${ele.id}</td>
                            <td>${ele.name}</td>
                            <td>${ele.qty}</td>
                            <td>₹${ele.price}</td>
                            <td>
                                <button class="btn btn-warning btn-sm" onclick="editproduct(${ele.id})">
                                    Edit
                                </button>

                                <button class="btn btn-danger btn-sm" onclick="deleteproduct(${ele.id})">
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `;
                })

                $("#tdata").html(row);

            });
        }


        function deleteproduct(pid) {
            $.get('delete', { pid }, function (rt) {
                alert(rt)
                displayproduct()
            })
        }

        function editproduct(pid) {
            $.get('edit', { pid }, function (rt) {
                $("#id").val(pid)
                $("#name").val(rt.p[0].name);
                $("#qty").val(rt.p[0].qty);
                $("#price").val(rt.p[0].price);

                
                $("#smbtn").hide()
                $("#upbtn").show()

            })
        }

        function updateproduct() {

            var id = $("#id").val();
            var name = $("#name").val();
            var qty = $("#qty").val();
            var price = $("#price").val();
            var csrfmiddlewaretoken = $("input[name='csrfmiddlewaretoken']").val();

            $.post('update', { id, name, qty, price, csrfmiddlewaretoken }, function (rt) {

                alert(rt);

                $("#smbtn").show();
                $("#upbtn").hide();
                 $("#name").val("");
                $("#qty").val("");
                $("#price").val("");

                displayproduct();
            });
        }
    </script>


    <div class="container mt-5">

        <!-- Product Form -->
        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white text-center">
                        <h3>Product Form</h3>
                    </div>

                    <div class="card-body">

                        <form>

                            {% csrf_token %}

                            <!-- Product Name -->
                            <input type="hidden" id="id">
                            <div class="mb-3">
                                <label class="form-label">
                                    Product Name
                                </label>

                                <input type="text" class="form-control" name="name" placeholder="Enter product name"
                                    id="name">
                            </div>


                            <!-- Quantity -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Quantity
                                </label>

                                <input type="number" class="form-control" name="qty" placeholder="Enter quantity"
                                    min="1" id="qty">
                            </div>


                            <!-- Price -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Price
                                </label>

                                <input type="number" class="form-control" name="price" placeholder="Enter price" min="0"
                                    id="price">
                            </div>


                            <!-- Submit -->
                            <div class="d-grid">

                                <button type="button" class="btn btn-primary" onclick="addproduct()" id="smbtn">

                                    Add Product

                                </button>
                                <button type="button" class="btn btn-primary" onclick="updateproduct()" id="upbtn">

                                    Update Product

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>


        <!-- Product Table -->
        <div class="row mt-5">

            <div class="col-12">

                <div class="card shadow">

                    <div class="card-header bg-dark text-white text-center">
                        <h3>Product List</h3>
                    </div>

                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table table-bordered table-striped table-hover text-center">

                                <thead class="table-primary">

                                    <tr>
                                        <th>Id</th>
                                        <th>Product Name</th>
                                        <th>Quantity</th>
                                        <th>Price</th>
                                        <th>Action</th>
                                    </tr>

                                </thead>

                                <tbody id="tdata">
                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
