<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product Form</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <div class="container mt-5">

    <div class="row justify-content-center">

      <div class="col-md-6">

        <div class="card shadow">

          <div class="card-header bg-primary text-white text-center">
            <h3>Product Form</h3>
          </div>

          <div class="card-body">

            <form method="post" action="{% url 'add'%}">
              {%csrf_token%}
              <span class="text-success">{{msg}}</span>

              <input type="hidden" name="id" value="{{p.id}}">
              <div class="mb-3">
                <label class="form-label">Product Name</label>
                <input type="text" class="form-control" placeholder="Enter product name" name="name" value="{{p.name}}">
              </div>

              <!-- Quantity -->
              <div class="mb-3">
                <label class="form-label">Quantity</label>
                <input type="number" class="form-control" placeholder="Enter quantity" name="qty" value="{{p.qty}}">
              </div>

              <!-- Price -->
              <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="number" class="form-control" placeholder="Enter price" name="price" value="{{p.price}}">
              </div>

              <!-- Submit -->
              <div class="d-grid">
                <button type="submit" class="btn btn-success">
                  Add Product
                </button> <br>
                <a href="{% url 'display'%}" class="btn btn-primary">View Data</a>
                
                
              </div>

            </form>

          </div>

        </div>

      </div>

    </div>

  </div>

</body>

</html>
