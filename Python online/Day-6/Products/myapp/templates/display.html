<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Table</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Product Table</h2>

    <table class="table table-bordered table-striped table-hover text-center">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
          {% for p in products%}
            <tr>
                <td>1</td>
                <td>{{p.name}}</td>
                <td>{{p.qty}}</td>
                <td>{{p.price}}</td>
                <td>
                    <a href="{% url 'edit'%}?id={{p.id}}" class="btn btn-primary btn-sm">Edit</a>
                    <a href="{% url 'delete'%}?id={{p.id}}" class="btn btn-danger btn-sm">Delete</a>
                </td>
            </tr>
            {%endfor%}

        
        
          <a href="{% url 'index'%}" class="btn btn-primary">Add To product</a>
    </table>



</div>

</body>
</html>
