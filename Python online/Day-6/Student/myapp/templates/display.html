<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Table</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">Student Details</h2>

        <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover text-center">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Subject</th>
                        <th>Marks</th>
                        <th colspan="2">Action</th>

                    </tr>
                </thead>

                <tbody>
                    {% for s in students%}
                    <tr>
                        <td>{{forloop.counter}}</td>
                        <td>{{s.name}}</td>
                        <td>{{s.age}}</td>
                        <td>{{s.email}}</td>
                        <td>{{s.subject}}</td>
                        <td>{{s.marks}}</td>
                        <td><a href="{%url 'delete'%}?id={{s.id}}" class="btn btn-danger">Delete</a></td>
                        <td><a href="{% url 'edit'%}?id={{s.id}}" class="btn btn-primary">
                                Edit
                            </a></td>
                    </tr>
                    {%endfor%}



                </tbody>

            </table>
            <a href="{%url 'index'%}" class="btn btn-warning">Back To register</a>
        </div>

    </div>

</body>

</html>
