<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Registration</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f2f5f9;
      min-height: 100vh;
    }

    .student-card {
      max-width: 900px;
      margin: 60px auto;
      border: none;
      border-radius: 15px;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #0d6efd, #6610f2);
      color: white;
      padding: 25px;
      text-align: center;
    }

    .card-header h2 {
      margin: 0;
      font-weight: 600;
    }

    .form-label {
      font-weight: 600;
      color: #333;
    }

    .form-control {
      padding: 12px;
      border-radius: 8px;
    }

    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 5px rgba(13, 110, 253, 0.3);
    }

    .submit-btn {
      padding: 12px 40px;
      border-radius: 8px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card shadow-lg student-card">

      <!-- Header -->
      <div class="card-header">
        <h2>Student Registration</h2>
        <p class="mb-0 mt-2">Enter Student Details</p>
      </div>

      <!-- Form -->
      <div class="card-body p-4">

        <form method="post" action ="{% url 'register' %}">
          {% csrf_token %}
          <span class="text-success">{{msg}}</span>

          <div class="d-flex flex-wrap gap-4">
            <input type="hidden" name="id" value="{{s.id}}">
            <!-- Name -->
            <div class="flex-fill">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" placeholder="Enter student name" name="name" value="{{s.name}}">
            </div>

            <!-- Email -->
            <div class="flex-fill">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" placeholder="Enter email" name="email" value="{{s.email}}">
            </div>

          </div>

          <div class="d-flex flex-wrap gap-4 mt-3">

            <!-- Age -->
            <div class="flex-fill">
              <label class="form-label">Age</label>
              <input type="number" class="form-control" placeholder="Enter age" name="age" value="{{s.age}}">
            </div>

            <!-- Subject -->
            <div class="flex-fill">
              <label class="form-label">Subject</label>
              <input type="text" class="form-control" placeholder="Enter subject" name="subject" value="{{s.subject}}">
            </div>

          </div>

          <!-- Marks -->
          <div class="mt-3">
            <label class="form-label">Marks</label>
            <input type="number" class="form-control" placeholder="Enter marks" name="marks" value="{{s.marks}}">
          </div>

          <!-- Button -->
          <div class="text-center mt-4">
            <button type="submit" class="btn btn-success submit-btn" >
              Submit
            </button>
            <a href="{% url 'display'%}" class="btn btn-primary submit-btn">
              View Students
            </a>
          </div>

        </form>

      </div>
    </div>

  </div>

</body>

</html>
