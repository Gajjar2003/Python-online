<!DOCTYPE html>
<html>

<head>
  <title>User Registration</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container mt-5">

    <div class="row justify-content-center">

      <div class="col-md-5">

        <div class="card shadow-lg border-0">

          <div class="card-header bg-primary text-white text-center">
            <h3 class="mb-0">User Registration</h3>
          </div>

          <div class="card-body p-4">

            <form method="POST" action="{% url 'user-register'%}">
              {% csrf_token %}
              <span class="text-success">{{meg}}</span>
              <span class="text-danger">{{err}}</span>

              <div class="mb-3">
                <label class="form-label">First Name</label>
                <input type="text" name="fname" class="form-control" placeholder="Enter first name" name="fname">
              </div>

              <div class="mb-3">
                <label class="form-label">Last Name</label>
                <input type="text" name="lname" class="form-control" placeholder="Enter last name" name="lname">
              </div>

              <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" name="username">
              </div>

              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" name="password">
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary">
                  Register
                </button>
              </div>

            </form>

          </div>

          <div class="card-footer text-center bg-white">
            Already have an account?
            <a href="{% url 'user-login'%}" class="text-decoration-none">Login</a>
          </div>

        </div>

      </div>

    </div>

  </div>

</body>

</html>
