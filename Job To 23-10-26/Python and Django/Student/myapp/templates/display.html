<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .main-card {
            border: none;
            border-radius: 15px;
        }

        .header {
            background: #0d6efd;
            color: white;
            border-radius: 15px 15px 0 0;
        }

        .table th {
            background-color: #0d6efd;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container py-5">

        <div class="card main-card shadow">

            <div class="header p-4 text-center">
                <h2>Student Management System</h2>
                <p class="mb-0">Student List</p>
            </div>

            <div class="card-body p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h4>All Students</h4>

                    <a href="{% url 'index' %}" class="btn btn-success">
                        + Add Student
                    </a>

                </div>

                <div class="table-responsive">

                    <table class="table table-bordered table-hover text-center">

                        <thead>
                            <tr>
                                <th>Id</th>
                                <th>Name</th>
                                <th>Age</th>
                                <th>Email</th>
                                <th>Number</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody>

                            {% for s in students %}

                            <tr>
                                <td>{{ forloop.counter }}</td>
                                <td>{{ s.name }}</td>
                                <td>{{ s.age }}</td>
                                <td>{{ s.email }}</td>
                                <td>{{ s.number }}</td>

                                <td>
                                    <a href="{% url 'edit'%}?id={{s.id}}" class="btn btn-warning btn-sm">
                                        Edit
                                    </a>

                                    <a href="{% url 'delete'%}?id={{s.id}}" class="btn btn-danger btn-sm">
                                        Delete
                                    </a>
                                </td>
                            </tr>

                            {% empty %}

                            <tr>
                                <td colspan="6" class="text-muted">
                                    No students found.
                                </td>
                            </tr>

                            {% endfor %}

                        </tbody>

                    </table>

                </div>

                <a href="{% url 'index' %}" class="btn btn-primary">
                    Back to Registration
                </a>

            </div>

        </div>

    </div>

</body>

</html>
