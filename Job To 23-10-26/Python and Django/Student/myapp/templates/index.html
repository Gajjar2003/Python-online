<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Management System</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f4f6f9;
    }

    .main-card {
      border: none;
      border-radius: 15px;
    }

    .header {
      background: #0d6efd;
      color: white;
      border-radius: 15px 15px 0 0;
    }

    .btn-custom {
      border-radius: 8px;
    }

    .table th {
      background-color: #0d6efd;
      color: white;
    }
  </style>
</head>

<body>

  <div class="container py-5">

    <div class="card main-card shadow">

      <!-- Header -->
      <div class="header p-4 text-center">
        <h2>Student Management System</h2>
        <p class="mb-0">Student Registration</p>
      </div>

      <div class="card-body p-4">

        <!-- Student Form -->
        <form method="POST" action="{% url 'register'%}">
          {% csrf_token %}


          <div class="row">
            <span class="text-success">{{meg}}</span>
            <!-- Name -->
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">
                Student Name
              </label>

              <input type="hidden" name="id" value="{{s.id}}">

              <input type="text" class="form-control" placeholder="Enter student name" name="name" value="{{s.name}}">
            </div>

            <!-- Age -->
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">
                Age
              </label>

              <input type="number" class="form-control" placeholder="Enter age" name="age" value="{{s.age}}">
            </div>

            <!-- Email -->
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">
                Email
              </label>

              <input type="email" class="form-control" placeholder="Enter email" name="email"  value="{{s.email}}">
            </div>

            <!-- Number -->
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">
                Mobile Number
              </label>

              <input type="text" class="form-control" placeholder="Enter mobile number" name="number" value="{{s.number}}">
            </div>

          </div>

          <button type="submit" class="btn btn-success btn-custom px-4">
            Add Student
          </button>
          <a href="{% url 'display'%}" class="btn btn-primary">View all</a>

        </form>







      </div>

    </div>

  </div>

</body>

</html>
