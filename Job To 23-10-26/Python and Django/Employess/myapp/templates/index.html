<!DOCTYPE html>
<html>
<head>
    <title>Employee Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3>Employee Registration</h3>
        </div>

        <div class="card-body">
            <form method="POST" action="{% url 'register'%}">
                {% csrf_token %}
                <span class="text-success">{{meg}}</span>
                <div class="mb-3">
                    <input type="hidden" value="{{e.id}}" name="id">
                    <label>Name</label>
                    <input type="text" name="name" class="form-control" name="name" value="{{e.name}}">
                </div>

                <div class="mb-3">
                    <label>Age</label>
                    <input type="number" name="age" class="form-control" name=" age" value="{{e.age}}">
                </div>

                <div class="mb-3">
                    <label>Number</label>
                    <input type="text" name="number" class="form-control" name="number" value="{{e.number}}">
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" name="email" value="{{e.email}}">
                </div>

                <div class="mb-3">
                    <label>City</label>
                    <input type="text" name="city" class="form-control" name="city" value="{{e.city}}">
                </div>

                <button type="submit" class="btn btn-success">
                    Save Employee
                </button>
                <a href="{% url 'display'%}" class="btn btn-primary">View all</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
